<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 국제이슈 온라인 지도</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
    }
    /* 지도 영역이 축소되지 않고 화면 전체를 채우도록 강제 */
    #map-wrapper {
      position: relative;
      flex: 1 1 0%;
      width: 100%;
      height: calc(100vh - 64px);
      min-height: 400px;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .custom-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      border: 2px solid white;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .custom-pin:hover {
      transform: rotate(-45deg) scale(1.2);
      filter: brightness(1.1);
      z-index: 1000 !important;
    }
    .custom-pin i {
      transform: rotate(45deg);
      font-size: 14px;
      color: white;
    }
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25);
    }
    .leaflet-popup-content {
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-full w-full select-none">

  <!-- Header Navigation (높이 64px 고정) -->
  <header class="h-16 bg-slate-900 border-b border-slate-800 z-20 px-4 flex items-center justify-between shadow-lg shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-emerald-400 flex items-center justify-center shadow-md">
        <i class="fa-solid fa-earth-americas text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
          우리반 국제이슈 지도
          <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">미디어·융합</span>
        </h1>
        <p class="text-xs text-slate-400 hidden sm:block">지도를 클릭해 우리반의 국제 탐구 이슈 핀을 등록하세요.</p>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-4">
      <div class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 flex items-center gap-3 text-xs">
        <div>
          <span class="text-slate-400 block text-[10px]">총 등록 이슈</span>
          <span id="stat-total" class="font-extrabold text-indigo-400 text-sm">0건</span>
        </div>
        <div class="w-px h-6 bg-slate-700"></div>
        <div>
          <span class="text-slate-400 block text-[10px]">서버 상태</span>
          <span id="sync-status" class="text-emerald-400 font-semibold flex items-center gap-1.5 text-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 연결 대기중
          </span>
        </div>
      </div>

      <div class="hidden sm:flex items-center gap-1.5">
        <button id="btn-export" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center gap-1.5 border border-slate-700">
          <i class="fa-solid fa-file-export text-emerald-400"></i> 내보내기
        </button>
        <button id="btn-import" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium flex items-center gap-1.5 border border-slate-700">
          <i class="fa-solid fa-file-import text-blue-400"></i> 가져오기
        </button>
        <input type="file" id="import-file-input" accept=".json" class="hidden">
      </div>

      <button id="btn-toggle-list" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-list-check text-indigo-400"></i>
        <span>이슈 목록</span>
      </button>
    </div>
  </header>

  <!-- Main Body Content -->
  <div id="map-wrapper">
    
    <!-- Left Floating Controls -->
    <div class="absolute top-4 left-4 z-[500] w-80 sm:w-96 flex flex-col gap-2.5 pointer-events-none">
      
      <!-- Search Box Card -->
      <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-md p-2.5 rounded-2xl border border-slate-700 shadow-2xl">
        <form id="search-form" class="relative flex items-center">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="나라 또는 도시 검색 (예: 프랑스, 카이로, 도쿄)" 
            class="w-full bg-slate-800 text-sm text-white pl-10 pr-24 py-2 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 placeholder-slate-500"
          >
          <button 
            type="submit" 
            id="search-btn"
            class="absolute right-1.5 px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium rounded-lg">
            검색
          </button>
        </form>
        <div id="search-msg" class="text-[11px] text-amber-400 mt-1 px-1 hidden flex items-center gap-1">
          <i class="fa-solid fa-circle-info"></i>
          <span id="search-msg-text"></span>
        </div>
      </div>

      <!-- Categories Filter Card -->
      <div class="pointer-events-auto bg-slate-900/90 backdrop-blur-md p-3 rounded-2xl border border-slate-700 shadow-2xl">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
            <i class="fa-solid fa-filter text-indigo-400"></i> 분야별 필터
          </span>
          <button id="reset-filter-btn" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-medium">전체 보기</button>
        </div>
        <div class="flex flex-wrap gap-1.5" id="category-filter-container"></div>
      </div>

      <!-- Click Guide Banner -->
      <div class="pointer-events-auto bg-indigo-950/90 backdrop-blur-md border border-indigo-700/50 rounded-xl p-2.5 shadow-lg flex items-center gap-2.5 text-xs text-indigo-200">
        <span class="p-1.5 bg-indigo-600/40 rounded-lg text-indigo-300"><i class="fa-solid fa-location-dot"></i></span>
        <div>지도 위의 아무 위치나 <strong>클릭</strong>하면 이슈 핀을 등록할 수 있습니다.</div>
      </div>
    </div>

    <!-- Map Canvas Element -->
    <div id="map"></div>

    <!-- Side Drawer -->
    <aside id="side-drawer" class="absolute top-0 right-0 h-full w-full sm:w-96 bg-slate-900/95 backdrop-blur-xl border-l border-slate-800 z-[600] shadow-2xl transform translate-x-full transition-transform duration-300 flex flex-col">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-newspaper text-indigo-400"></i>
          <h2 class="font-bold text-sm text-white">등록된 국제 이슈 목록</h2>
        </div>
        <button id="btn-close-drawer" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="issues-list-container"></div>
    </aside>

  </div>

  <!-- Registration Modal -->
  <div id="register-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[1000] flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div>
            <h3 class="font-bold text-white text-base">새 국제이슈 핀 등록</h3>
            <p id="modal-location-text" class="text-xs text-indigo-300 font-medium truncate max-w-[260px]">위치 확인 중...</p>
          </div>
        </div>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white text-lg p-1.5"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="issue-form" class="p-6 overflow-y-auto space-y-4 flex-1">
        <input type="hidden" id="form-lat">
        <input type="hidden" id="form-lng">

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="input-author">학번 및 이름 <span class="text-rose-400">*</span></label>
          <input type="text" id="input-author" required placeholder="예: 20900 ㅇㅇㅇ" class="w-full bg-slate-800 text-sm text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="input-place-name">나라 / 도시 (Country & City) <span class="text-rose-400">*</span></label>
          <input type="text" id="input-place-name" required placeholder="예: Paris, France 또는 Tokyo, Japan" class="w-full bg-slate-800 text-sm text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="input-category">관심 분야 <span class="text-rose-400">*</span></label>
          <select id="input-category" required class="w-full bg-slate-800 text-sm text-white px-3.5 py-2.5 rounded-xl border border-slate-700"></select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="input-title">이슈 제목 <span class="text-rose-400">*</span></label>
          <input type="text" id="input-title" required placeholder="예: 아마존 열대우림 벌채와 기후 정의 논란" class="w-full bg-slate-800 text-sm text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="input-desc">주요 내용 <span class="text-rose-400">*</span></label>
          <textarea id="input-desc" rows="3" required placeholder="이슈의 내용 및 시사점을 작성해주세요." class="w-full bg-slate-800 text-sm text-white px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="input-link">관련 링크 (선택)</label>
          <input type="url" id="input-link" placeholder="https://..." class="w-full bg-slate-800 text-sm text-white px-3.5 py-2.5 rounded-xl border border-slate-700">
        </div>

        <div class="pt-3 flex items-center justify-end gap-3 border-t border-slate-800">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold">취소</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold">지도에 핀 꽂기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-[1100] flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-5 text-center shadow-2xl">
      <div class="w-12 h-12 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto mb-3 text-xl">
        <i class="fa-solid fa-trash-can"></i>
      </div>
      <h4 class="text-base font-bold text-white mb-1">이슈 핀을 삭제하시겠습니까?</h4>
      <p class="text-xs text-slate-400 mb-5">삭제된 데이터는 복구되지 않습니다.</p>
      <div class="flex items-center justify-center gap-3">
        <button id="btn-cancel-delete" class="flex-1 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">취소</button>
        <button id="btn-confirm-delete" class="flex-1 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">삭제하기</button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-[1200] transform translate-y-16 opacity-0 transition-all duration-300 flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold pointer-events-none"></div>

  <script>
    const CATEGORIES = {
      '환경·기후': { color: '#10b981', bgClass: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', icon: 'fa-leaf' },
      '경제·산업': { color: '#f59e0b', bgClass: 'bg-amber-500/20 text-amber-400 border-amber-500/30', icon: 'fa-chart-line' },
      '사회·인권': { color: '#ef4444', bgClass: 'bg-rose-500/20 text-rose-400 border-rose-500/30', icon: 'fa-hand-fist' },
      '정치·외교': { color: '#6366f1', bgClass: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30', icon: 'fa-landmark' },
      '과학·기술': { color: '#06b6d4', bgClass: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30', icon: 'fa-microchip' },
      '문화·교육': { color: '#8b5cf6', bgClass: 'bg-violet-500/20 text-violet-400 border-violet-500/30', icon: 'fa-graduation-cap' },
      '미디어·언론': { color: '#ec4899', bgClass: 'bg-pink-500/20 text-pink-400 border-pink-500/30', icon: 'fa-bullhorn' }
    };

    let map;
    let markersLayer;
    let boundaryLayer = null;
    let issues = [];
    let activeFilter = '전체';
    let selectedIssueIdToDelete = null;

    function initMap() {
      map = L.map('map', {
        center: [30, 20],
        zoom: 3,
        minZoom: 2,
        maxZoom: 18,
        worldCopyJump: true,
        zoomControl: false
      });

      // 영어 지도 레이어 (OpenStreetMap CartoDB Positron)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors © CARTO',
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      map.on('click', (e) => {
        openRegisterModal(e.latlng.lat, e.latlng.lng);
      });

      // 지도 컨테이너 리사이징 보정
      setTimeout(() => { map.invalidateSize(); }, 200);
    }

    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&accept-language=en`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.address) {
            const country = data.address.country || '';
            const city = data.address.city || data.address.state || data.address.town || '';
            if (country && city) return `${city}, ${country}`;
            if (country) return country;
          }
          return data.display_name || `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
        }
      } catch (err) {}
      return `${lat.toFixed(2)}, ${lng.toFixed(2)}`;
    }

    async function searchLocation(query) {
      if (!query.trim()) return;
      const searchMsg = document.getElementById('search-msg');
      const searchMsgText = document.getElementById('search-msg-text');
      searchMsg.classList.remove('hidden');
      searchMsgText.innerText = `'${query}' 검색 중...`;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&polygon_geojson=1&q=${encodeURIComponent(query)}&accept-language=en&limit=1`);
        const data = await res.json();

        if (data && data.length > 0) {
          const result = data[0];
          if (boundaryLayer) map.removeLayer(boundaryLayer);

          if (result.geojson) {
            boundaryLayer = L.geoJSON(result.geojson, {
              style: { color: '#ef4444', weight: 3.5, opacity: 0.9, fillColor: '#ef4444', fillOpacity: 0.1 }
            }).addTo(map);
            map.fitBounds(boundaryLayer.getBounds(), { padding: [40, 40], maxZoom: 8 });
          } else {
            map.flyTo([parseFloat(result.lat), parseFloat(result.lon)], 6);
          }
          searchMsg.classList.add('hidden');
          showToast(`'${result.display_name.split(',')[0]}' 위치로 이동했습니다.`, 'success');
        } else {
          searchMsgText.innerText = "검색 결과가 없습니다.";
        }
      } catch (e) {
        searchMsgText.innerText = "검색 중 오류가 발생했습니다.";
      }
    }

    async function openRegisterModal(lat, lng) {
      const modal = document.getElementById('register-modal');
      document.getElementById('form-lat').value = lat;
      document.getElementById('form-lng').value = lng;
      document.getElementById('input-place-name').value = '';
      document.getElementById('modal-location-text').innerText = '위치 확인 중...';
      modal.classList.remove('hidden');

      const placeName = await reverseGeocode(lat, lng);
      document.getElementById('modal-location-text').innerText = placeName;
      document.getElementById('input-place-name').value = placeName;
    }

    function closeRegisterModal() {
      document.getElementById('register-modal').classList.add('hidden');
      document.getElementById('issue-form').reset();
    }

    function createCustomMarkerIcon(categoryKey) {
      const config = CATEGORIES[categoryKey] || CATEGORIES['사회·인권'];
      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div class="custom-pin" style="background-color: ${config.color};"><i class="fa-solid ${config.icon}"></i></div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    }

    function renderMapMarkers() {
      markersLayer.clearLayers();
      const filtered = activeFilter === '전체' ? issues : issues.filter(i => i.category === activeFilter);

      filtered.forEach(issue => {
        const catConfig = CATEGORIES[issue.category] || CATEGORIES['사회·인권'];
        const marker = L.marker([issue.lat, issue.lng], { icon: createCustomMarkerIcon(issue.category) });

        const popupContent = document.createElement('div');
        popupContent.className = 'w-72 bg-slate-900 text-slate-100 p-4 rounded-2xl shadow-xl border border-slate-800 text-xs';
        popupContent.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-2">
            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full font-bold text-[11px] border ${catConfig.bgClass}">
              <i class="fa-solid ${catConfig.icon}"></i> ${escapeHtml(issue.category)}
            </span>
            <span class="text-slate-400 text-[10px]">${issue.date || ''}</span>
          </div>
          <div class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-800 text-indigo-300 text-[11px] font-semibold mb-1.5 border border-slate-700/60 max-w-full truncate">
            <i class="fa-solid fa-location-dot text-indigo-400"></i> ${escapeHtml(issue.placeName || 'Global')}
          </div>
          <h3 class="font-bold text-sm text-white mb-1 leading-snug">${escapeHtml(issue.title)}</h3>
          <div class="text-[11px] text-slate-300 mb-2">작성자: <strong>${escapeHtml(issue.author)}</strong></div>
          <div class="p-2.5 bg-slate-800 rounded-xl text-slate-300 text-xs mb-3 max-h-36 overflow-y-auto">${escapeHtml(issue.desc)}</div>
          <div class="pt-2 border-t border-slate-800 flex items-center justify-end">
            <button class="btn-del text-rose-400 hover:text-rose-300 text-xs font-semibold"><i class="fa-solid fa-trash-can"></i> 삭제</button>
          </div>
        `;

        popupContent.querySelector('.btn-del').addEventListener('click', (e) => {
          e.stopPropagation();
          promptDelete(issue.id);
        });

        marker.bindPopup(popupContent, { maxWidth: 320 });
        markersLayer.addLayer(marker);
      });

      document.getElementById('stat-total').innerText = `${issues.length}건`;
      renderSidebarList();
    }

    function renderSidebarList() {
      const container = document.getElementById('issues-list-container');
      const filtered = activeFilter === '전체' ? issues : issues.filter(i => i.category === activeFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500 text-xs">등록된 이슈가 없습니다.</div>`;
        return;
      }

      container.innerHTML = filtered.map(issue => {
        const catConfig = CATEGORIES[issue.category] || CATEGORIES['사회·인권'];
        return `
          <div class="p-3 bg-slate-800/60 hover:bg-slate-800 rounded-2xl border border-slate-700 cursor-pointer" data-id="${issue.id}">
            <div class="flex items-center justify-between mb-1.5">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${catConfig.bgClass}">${escapeHtml(issue.category)}</span>
              <span class="text-[10px] text-slate-400">${escapeHtml(issue.author)}</span>
            </div>
            <h4 class="text-xs font-bold text-white mb-1">${escapeHtml(issue.title)}</h4>
            <p class="text-[11px] text-slate-400 line-clamp-2 mb-2">${escapeHtml(issue.desc)}</p>
            <div class="flex items-center justify-between text-[10px] text-slate-500 pt-1.5 border-t border-slate-700/50">
              <span class="truncate max-w-[180px]">${escapeHtml(issue.placeName || 'Global')}</span>
              <button class="text-rose-400 hover:text-rose-300 btn-del-item" data-del="${issue.id}"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('[data-id]').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('.btn-del-item')) return;
          const id = card.getAttribute('data-id');
          const target = issues.find(i => i.id === id);
          if (target) map.flyTo([target.lat, target.lng], 6);
        });
      });

      container.querySelectorAll('.btn-del-item').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          promptDelete(btn.getAttribute('data-del'));
        });
      });
    }

    async function loadIssuesFromServer() {
      const syncStatusEl = document.getElementById('sync-status');
      
      // 로컬 스토리지 데이터 먼저 즉시 로드
      const localData = localStorage.getItem('class_world_issues_data');
      if (localData) {
        try {
          issues = JSON.parse(localData);
          renderMapMarkers();
        } catch(e) {}
      }

      try {
        const res = await fetch('/api/issues');
        if (res.ok) {
          issues = await res.json();
          localStorage.setItem('class_world_issues_data', JSON.stringify(issues));
          renderMapMarkers();
          syncStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ☁️ Vercel KV 연결됨`;
        } else {
          syncStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> 로컬 모드`;
        }
      } catch (err) {
        syncStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> 로컬 모드`;
      }
    }

    async function saveIssue(newIssue) {
      issues.unshift(newIssue);
      localStorage.setItem('class_world_issues_data', JSON.stringify(issues));
      renderMapMarkers();

      try {
        await fetch('/api/issues', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newIssue)
        });
        showToast("클라우드 서버에 동기화되었습니다!", "success");
      } catch (e) {
        showToast("로컬에 임시 저장되었습니다.", "info");
      }
    }

    async function deleteIssue(issueId) {
      issues = issues.filter(item => item.id !== issueId);
      localStorage.setItem('class_world_issues_data', JSON.stringify(issues));
      renderMapMarkers();

      try {
        await fetch(`/api/issues?id=${encodeURIComponent(issueId)}`, { method: 'DELETE' });
        showToast("삭제되었습니다.", "info");
      } catch (e) {}
    }

    function promptDelete(id) {
      selectedIssueIdToDelete = id;
      document.getElementById('delete-modal').classList.remove('hidden');
    }

    function setupCategoryUI() {
      const container = document.getElementById('category-filter-container');
      const select = document.getElementById('input-category');

      select.innerHTML = Object.keys(CATEGORIES).map(cat => `<option value="${cat}">${cat}</option>`).join('');

      container.innerHTML = Object.keys(CATEGORIES).map(cat => `
        <button type="button" data-filter="${cat}" class="filter-tag text-[11px] font-medium px-2.5 py-1 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full" style="background-color: ${CATEGORIES[cat].color}"></span>
          ${cat}
        </button>
      `).join('');

      container.querySelectorAll('.filter-tag').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.getAttribute('data-filter');
          activeFilter = (activeFilter === cat) ? '전체' : cat;
          renderMapMarkers();
        });
      });

      document.getElementById('reset-filter-btn').addEventListener('click', () => {
        activeFilter = '전체';
        renderMapMarkers();
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      toast.className = `fixed bottom-6 right-6 z-[1200] flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold ${type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-white border border-slate-700'}`;
      toast.innerText = message;
      toast.classList.remove('translate-y-16', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-16', 'opacity-0');
      }, 3000);
    }

    // 진입점: 지도를 1순위로 즉시 로딩
    window.onload = function() {
      initMap();
      setupCategoryUI();
      loadIssuesFromServer();

      // 이벤트 바인딩
      document.getElementById('search-form').addEventListener('submit', (e) => {
        e.preventDefault();
        searchLocation(document.getElementById('search-input').value);
      });

      document.getElementById('issue-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const now = new Date();
        const newIssue = {
          id: 'issue_' + Date.now(),
          lat: parseFloat(document.getElementById('form-lat').value),
          lng: parseFloat(document.getElementById('form-lng').value),
          author: document.getElementById('input-author').value.trim(),
          placeName: document.getElementById('input-place-name').value.trim(),
          category: document.getElementById('input-category').value,
          title: document.getElementById('input-title').value.trim(),
          desc: document.getElementById('input-desc').value.trim(),
          link: document.getElementById('input-link').value.trim() || null,
          date: `${now.getMonth() + 1}월 ${now.getDate()}일`,
          timestamp: Date.now()
        };
        await saveIssue(newIssue);
        closeRegisterModal();
      });

      document.getElementById('btn-close-modal').addEventListener('click', closeRegisterModal);
      document.getElementById('btn-cancel-modal').addEventListener('click', closeRegisterModal);
      document.getElementById('btn-cancel-delete').addEventListener('click', () => {
        document.getElementById('delete-modal').classList.add('hidden');
      });
      document.getElementById('btn-confirm-delete').addEventListener('click', async () => {
        if (selectedIssueIdToDelete) {
          await deleteIssue(selectedIssueIdToDelete);
          document.getElementById('delete-modal').classList.add('hidden');
        }
      });
      document.getElementById('btn-toggle-list').addEventListener('click', () => {
        document.getElementById('side-drawer').classList.toggle('translate-x-full');
      });
      document.getElementById('btn-close-drawer').addEventListener('click', () => {
        document.getElementById('side-drawer').classList.add('translate-x-full');
      });
    };
  </script>
</body>
</html>
