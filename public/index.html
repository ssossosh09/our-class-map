<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 국제이슈 온라인 지도</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    #map { height: 100%; width: 100%; z-index: 1; }
    .custom-pin {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      border: 2px solid white; cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease;
    }
    .custom-pin:hover { transform: rotate(-45deg) scale(1.2); filter: brightness(1.1); z-index: 1000 !important; }
    .custom-pin i { transform: rotate(45deg); font-size: 14px; color: white; }
    .leaflet-popup-content-wrapper { padding: 0; border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.25); }
    .leaflet-popup-content { margin: 0; line-height: 1.5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden select-none">

  <!-- Header Navigation -->
  <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 z-20 px-4 py-2.5 flex items-center justify-between shadow-lg shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-emerald-400 flex items-center justify-center shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-earth-americas text-white text-lg"></i>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight text-white flex items-center gap-2">
          우리반 국제이슈 지도
          <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">미디어·융합</span>
        </h1>
        <p class="text-xs text-slate-400 hidden sm:block">지도를 클릭해 우리반의 국제 탐구 이슈 핀을 등록하세요.</p>
      </div>
    </div>

    <!-- Right Actions & Stats Counter -->
    <div class="flex items-center gap-2 sm:gap-4">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl px-3 py-1.5 flex items-center gap-3 text-xs">
        <div>
          <span class="text-slate-400 block text-[10px]">총 등록 이슈</span>
          <span id="stat-total" class="font-extrabold text-indigo-400 text-sm">0건</span>
        </div>
        <div class="w-px h-6 bg-slate-700"></div>
        <div>
          <span class="text-slate-400 block text-[10px]">서버 연결</span>
          <span id="sync-status" class="text-amber-400 font-semibold flex items-center gap-1.5 text-xs">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> 서버 연결 중...
          </span>
        </div>
      </div>

      <!-- Import / Export for Easy Sharing -->
      <div class="hidden sm:flex items-center gap-1.5">
        <button id="btn-export" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs font-medium flex items-center gap-1.5 transition" title="친구들에게 전달할 데이터 파일(JSON) 다운로드">
          <i class="fa-solid fa-file-export text-emerald-400"></i>
          <span>내보내기</span>
        </button>
        <button id="btn-import" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-
